name: Shipment Management CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Check backend syntax
        working-directory: server
        run: node --check server.js

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Run frontend tests and coverage
        working-directory: client
        run: npm run coverage

      - name: Initialize Test Database
        working-directory: server
        env:
          JWT_SECRET: test-secret-for-ci
        run: npm run db:init

      - name: Seed Test Database
        working-directory: server
        env:
          JWT_SECRET: test-secret-for-ci
        run: npm run db:seed

      - name: Run Backend Tests
        working-directory: server
        env:
          JWT_SECRET: test-secret-for-ci
        run: npm run coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage/
          if-no-files-found: warn

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/
          if-no-files-found: warn

  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Analyze frontend
        working-directory: client
        run: npm run lint

      - name: Analyze backend
        working-directory: server
        run: npm run lint

  reporting:
    name: Reporting
    runs-on: ubuntu-latest
    needs: [build, test, analysis]
    if: always()

    steps:
      - name: Generate pipeline summary
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
        run: |
          echo "## CI/CD Pipeline Report" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | $BUILD_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test | $TEST_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Analysis | $ANALYSIS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
